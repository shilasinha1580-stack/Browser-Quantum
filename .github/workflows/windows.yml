name: Build Windows 32-bit & 64-bit

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisDirs = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS")
          $nsisFound = $false
          foreach ($dir in $nsisDirs) {
            if (Test-Path "$dir\makensis.exe") {
              Write-Host "Found NSIS at: $dir"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $nsisFound = $true
              break
            }
          }
          if (-not $nsisFound) {
            throw "makensis.exe was not found in expected NSIS directories after installation."
          }

      - name: Verify makensis Availability
        shell: pwsh
        run: |
          Get-Command makensis
          makensis /VERSION

      - name: Prepare Real Standalone Mozilla Gecko Runtime for x64 and x86
        shell: pwsh
        run: |
          & ./desktop/windows/prepare-gecko-runtime.ps1 -Arch both

      - name: Verify Packaging Prerequisites
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/windows/quantum-browser.nsi")) { throw "quantum-browser.nsi missing" }
          if (-not (Test-Path "public/logo.ico")) { throw "logo.ico missing" }
          if (-not (Test-Path "LICENSE")) { throw "LICENSE missing" }
          if (-not (Test-Path "desktop/windows/bin/x64/xul.dll")) { throw "bin/x64/xul.dll (Gecko Engine) missing" }
          if (-not (Test-Path "desktop/windows/bin/x86/xul.dll")) { throw "bin/x86/xul.dll (Gecko Engine) missing" }
          New-Item -ItemType Directory -Force -Path "desktop/windows/output"

      - name: Compile Windows 64-bit Installer
        shell: pwsh
        working-directory: desktop/windows
        run: |
          makensis /DARCH=x64 quantum-browser.nsi

      - name: Compile Windows 32-bit Installer
        shell: pwsh
        working-directory: desktop/windows
        run: |
          makensis /DARCH=x86 quantum-browser.nsi

      - name: Verify Installer Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path desktop/windows/output/*.exe

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: quantum-browser-windows
          path: desktop/windows/output/*.exe

