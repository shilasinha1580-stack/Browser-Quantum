name: Build Android ARM64 APK

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android ARM64 Release APK
        working-directory: android
        run: |
          gradle assembleRelease

      - name: Verify APK Output
        run: |
          test -d android/app/build/outputs/apk/release
          ls -lh android/app/build/outputs/apk/release/*.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-browser-arm64
          path: android/app/build/outputs/apk/release/*.apk
